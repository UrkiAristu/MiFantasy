<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="100%" height="100%">
  <defs>
    <!-- Degradado para la palabra Fantasy -->
    <linearGradient id="fantasyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- EL TRUCO: Creamos un "molde" con la misma forma exacta que el fondo redondeado -->
    <clipPath id="stadium-clip">
      <rect x="2" y="2" width="436" height="116" rx="58" />
    </clipPath>
  </defs>

  <style>
    /* Estilos base (Modo Claro) */
    .pill-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; }
    .pitch-lines { fill: none; stroke: #059669; stroke-width: 2; opacity: 0.15; }
    .pitch-lines-dashed { fill: none; stroke: #059669; stroke-width: 2; opacity: 0.15; stroke-dasharray: 6 6; }
    
    .brand-text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 64px;
      letter-spacing: -1.5px;
    }
    .text-mi { fill: #0f172a; }
    .text-fantasy { fill: url(#fantasyGrad); }

    /* Soporte para Modo Oscuro nativo */
    @media (prefers-color-scheme: dark) {
      .pill-bg { fill: #0f172a; stroke: #1e293b; }
      .pitch-lines, .pitch-lines-dashed { stroke: #34d399; opacity: 0.12; }
      .text-mi { fill: #ffffff; }
    }
  </style>

  <!-- 1. CONTENEDOR PASTILLA -->
  <rect class="pill-bg" x="2" y="2" width="436" height="116" rx="58" />

  <!-- 2. LÍNEAS DEL CAMPO (Ahora están metidas dentro del clip-path para que no sobresalgan) -->
  <g clip-path="url(#stadium-clip)">
    <!-- Medio campo -->
    <line class="pitch-lines-dashed" x1="220" y1="2" x2="220" y2="118" />
    <circle class="pitch-lines" cx="220" cy="60" r="28" />
    <circle cx="220" cy="60" r="4" fill="#059669" fill-opacity="0.15" />
    
    <!-- Área izquierda -->
    <rect class="pitch-lines" x="2" y="25" width="45" height="70" />
    <rect class="pitch-lines" x="2" y="42" width="18" height="36" />
    <path class="pitch-lines" d="M 47 45 Q 65 60 47 75" />
    
    <!-- Área derecha -->
    <rect class="pitch-lines" x="393" y="25" width="45" height="70" />
    <rect class="pitch-lines" x="420" y="42" width="18" height="36" />
    <path class="pitch-lines" d="M 393 45 Q 375 60 393 75" />
  </g>

  <!-- 3. TEXTO CLAVADO EN EL CENTRO -->
  <text x="220" y="64" text-anchor="middle" dominant-baseline="middle" class="brand-text">
    <tspan class="text-mi">Mi</tspan><tspan class="text-fantasy">Fantasy</tspan>
  </text>
</svg>
