services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mifantasy_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mifantasy-network

  queue_worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: mifantasy_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php artisan queue:work redis --tries=3 --timeout=90
    networks:
      - mifantasy-network

  web:
    image: nginx:alpine
    container_name: mifantasy_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - mifantasy-network

  node:
    image: node:20-alpine
    container_name: mifantasy_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - mifantasy-network

  redis:
    image: redis:alpine
    container_name: mifantasy_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mifantasy-network

  db:
    image: mysql:8.0
    container_name: mifantasy_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mifantasy-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: mifantasy_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: ${PMA_HOST}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mifantasy-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: mifantasy_ngrok
    depends_on:
      - web
    command: [ "http", "web:80" ]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - mifantasy-network

volumes:
  dbdata:
  redisdata:

networks:
  mifantasy-network:
    driver: bridge
